name: agent-corporation

x-api-environment: &api-environment
  APP_CONFIG_FILE: /runtime-secrets/app.json
  CODEX_SERVER_BASE_URL: http://host.docker.internal:15600
  CODEX_SERVER_TRANSPORT: docker-host
  OWNER_SECRET_PATH: /runtime-secrets/owner-secret
  RUNTIME_GATE_PATH: /runtime-secrets/cg01-proof.json
  RUNTIME_GATEWAY_SOURCE_PATH: /gateway-source
  RUNTIME_CG01_DEMO_TEST_OVERRIDE: ${RUNTIME_CG01_DEMO_TEST_OVERRIDE:-false}
  PLAYGROUND_WORKER_ENABLED: ${PLAYGROUND_WORKER_ENABLED:-true}

x-api-base: &api-base
  image: agent-corporation-api:local
  build:
    context: .
    dockerfile: apps/api/Dockerfile
    target: runtime
  environment: *api-environment
  user: "1000:1000"
  init: true
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=64m
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  volumes:
    - runtime_secrets:/runtime-secrets:ro
    - artifacts:/app/storage
    - ${GATEWAY_SOURCE_ROOT:-../codex-server}/package.json:/gateway-source/package.json:ro
    - ${GATEWAY_SOURCE_ROOT:-../codex-server}/src/server.ts:/gateway-source/src/server.ts:ro
    - ${GATEWAY_SOURCE_ROOT:-../codex-server}/src/schema.ts:/gateway-source/src/schema.ts:ro
    - ${GATEWAY_SOURCE_ROOT:-../codex-server}/src/provider.ts:/gateway-source/src/provider.ts:ro
    - ${GATEWAY_SOURCE_ROOT:-../codex-server}/src/config.ts:/gateway-source/src/config.ts:ro
  restart: "no"

services:
  bootstrap:
    profiles: [setup]
    image: agent-corporation-api:local
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: runtime
    user: "0:0"
    network_mode: none
    read_only: true
    volumes:
      - .:/operator:ro
      - runtime_secrets:/runtime-secrets
      - database_secrets:/database-secrets
      - agent_corporation_postgres:/postgres-state:ro
    command: [python, scripts/docker_initialize.py]
    restart: "no"

  postgres:
    image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    container_name: agent-corporation-postgres
    entrypoint: [/bin/sh, -ec, 'set -a; . /database-secrets/postgres.env; set +a; exec /usr/local/bin/docker-entrypoint.sh "$$@"', '--']
    command: [postgres]
    ports:
      - "127.0.0.1:15510:5432"
    volumes:
      - agent_corporation_postgres:/var/lib/postgresql
      - database_secrets:/database-secrets:ro
    healthcheck:
      test: ["CMD-SHELL", ". /database-secrets/postgres.env; pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: "no"

  migrate:
    profiles: [setup]
    <<: *api-base
    environment:
      <<: *api-environment
      APP_CONFIG_FILE: /database-secrets/migration.json
      PLAYGROUND_WORKER_ENABLED: "false"
    volumes:
      - database_secrets:/database-secrets:ro
    depends_on:
      postgres:
        condition: service_healthy
    command: [alembic, -c, apps/api/alembic.ini, upgrade, head]

  api:
    <<: *api-base
    container_name: agent-corporation-api
    ports:
      - "127.0.0.1:15501:15501"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:15501/api/v1/health/ready', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    stop_grace_period: 30s

  web:
    image: agent-corporation-web:local
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: agent-corporation-web
    ports:
      - "127.0.0.1:15500:15500"
    depends_on:
      api:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:15500/healthz]
      interval: 10s
      timeout: 3s
      retries: 6
    restart: "no"

  worker:
    profiles: [runtime-worker]
    <<: *api-base
    container_name: agent-corporation-runtime-worker
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
    entrypoint: [python, -m, agent_corporation_api.modules.execution.worker]
    command: [--environment, b93f752e-7b69-5e8b-8f74-1498a15a5609, --company, b4375333-b12b-5fca-b984-87864032d3a8]
    stop_grace_period: 30s
    restart: unless-stopped

  proof-admin:
    profiles: [operator]
    image: agent-corporation-api:local
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: runtime
    user: "1000:1000"
    network_mode: none
    read_only: true
    environment:
      CODEX_SERVER_BASE_URL: http://host.docker.internal:15600
      CODEX_SERVER_TRANSPORT: docker-host
      RUNTIME_GATE_PATH: /runtime-secrets/cg01-proof.json
      RUNTIME_GATEWAY_SOURCE_PATH: /gateway-source
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes:
      - runtime_secrets:/runtime-secrets
      - ${GATEWAY_SOURCE_ROOT:-../codex-server}/package.json:/gateway-source/package.json:ro
      - ${GATEWAY_SOURCE_ROOT:-../codex-server}/src/server.ts:/gateway-source/src/server.ts:ro
      - ${GATEWAY_SOURCE_ROOT:-../codex-server}/src/schema.ts:/gateway-source/src/schema.ts:ro
      - ${GATEWAY_SOURCE_ROOT:-../codex-server}/src/provider.ts:/gateway-source/src/provider.ts:ro
      - ${GATEWAY_SOURCE_ROOT:-../codex-server}/src/config.ts:/gateway-source/src/config.ts:ro
    stdin_open: true
    command: [python, scripts/manage_cg01_proof.py]
    restart: "no"

volumes:
  agent_corporation_postgres:
    name: ${AGENT_CORPORATION_DB_VOLUME:-agent-corporation_agent_corporation_postgres}
  runtime_secrets:
  database_secrets:
  artifacts:

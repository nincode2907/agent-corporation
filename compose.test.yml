services:
  isolated-postgres:
    image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    environment:
      POSTGRES_USER: ${ISOLATED_PG_ADMIN_USER:?isolated test admin user is required}
      POSTGRES_PASSWORD: ${ISOLATED_PG_ADMIN_PASSWORD:?isolated test admin password is required}
      POSTGRES_DB: postgres
    command:
      - postgres
      - -c
      - max_connections=24
      - -c
      - shared_buffers=64MB
      - -c
      - work_mem=4MB
    volumes:
      - test_pgdata:/var/lib/postgresql
    networks:
      - isolated
    mem_limit: 512m
    memswap_limit: 768m
    cpus: 0.75
    pids_limit: 96
    shm_size: 64m
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d postgres"]
      interval: 3s
      timeout: 2s
      retries: 20
      start_period: 3s
    restart: "no"

  api-tests:
    image: ${ISOLATED_TEST_IMAGE:-agent-corporation-api-tests:isolated}
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: test
    user: "1000:1000"
    environment:
      DATABASE_URL: ${ISOLATED_TEST_DATABASE_URL:-postgresql+psycopg://unset:unset@isolated-postgres:5432/not_configured}
      MIGRATION_DATABASE_URL: ${ISOLATED_TEST_MIGRATION_DATABASE_URL:-postgresql+psycopg://unset:unset@isolated-postgres:5432/not_configured}
      APP_DATABASE_USER: ${ISOLATED_TEST_DATABASE_USER:-unset}
      APP_DATABASE_PASSWORD: ${ISOLATED_TEST_DATABASE_PASSWORD:-unset}
      OWNER_SECRET_PATH: /tmp/nonexistent-owner-secret
      RUNTIME_GATE_PATH: /tmp/nonexistent-cg01-proof.json
      RUNTIME_GATEWAY_SOURCE_PATH: /tmp/nonexistent-gateway
      CODEX_SERVER_BASE_URL: http://127.0.0.1:1
      CODEX_SERVER_API_KEY: ""
      CODEX_SERVER_TRANSPORT: loopback
      RUNTIME_CG01_DEMO_TEST_OVERRIDE: "false"
      PLAYGROUND_WORKER_ENABLED: "false"
      PLAYGROUND_TEST_ISOLATED: "1"
      PHASE_RUNTIME_TEST_ISOLATED: "1"
      PHASE_QUEUE_TEST_ISOLATED: "1"
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: /app/apps/api/src
      HOME: /tmp
      UV_CACHE_DIR: /tmp/uv-cache
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      ALL_PROXY: ""
      http_proxy: ""
      https_proxy: ""
      all_proxy: ""
      NO_PROXY: "*"
      no_proxy: "*"
    networks:
      - isolated
    depends_on:
      isolated-postgres:
        condition: service_healthy
    mem_limit: 1536m
    memswap_limit: 2g
    cpus: 1.0
    pids_limit: 256
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m,mode=1777
    read_only: true
    restart: "no"

networks:
  isolated:
    internal: true

volumes:
  test_pgdata: {}
